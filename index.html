<!doctype html>
<html lang="en">
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Fylo data storage component</title>
  </head>
  <body>
    <main>
      <section class="left-container d-flex flex flex-column align-items-start">
        <img class="logo-img" src="images/logo.svg" alt="logo" />

        <div class="left2 d-flex align-items-center">
          <div class="d-flex justify-content-center align-items-center">
            <img
              src="images/icon-document.svg"
              alt=""
              width="19.18px"
              height="23.98px"
            />
          </div>
          <div class="d-flex justify-content-center align-items-center">
            <img
              src="images/icon-folder.svg"
              alt=""
              width="24px"
              height="19.2px"
            />
          </div>
          <div class="d-flex justify-content-center align-items-center">
            <img
              src="images/icon-upload.svg"
              alt=""
              width="24px"
              height="16px"
            />
          </div>
        </div>
      </section>

      <section class="right-container">
        <p>You've used 815 GB of your storage</p>

        <div class="progress">
          <div class="progress-fill">
            <span class="dot"></span>
          </div>
        </div>

        <div class="storage">
          <span>0 GB</span>
          <span>1000 GB</span>
        </div>

        <div class="popup">
          <span class="number">185</span>
          <span class="text">GB LEFT</span>
        </div>
      </section>
    </main>
  </body>
</html>
