<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Fylo data storage component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }

      *{
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        background-color: #0c122c;
        justify-content: center;
        align-items: center;
      }

      main {
      width: 922px;
      /* height: 201px; */
      background-color: rgb(110, 124, 124);
      display: flex;
      align-items: flex-end;
      gap: 30px;
      }

      .left {
        width: 176px;
        height: 119.27px;
        justify-content: center;
        align-items: center;
      }
      .left-container {
        width: 350px;
        height: 201px;
        padding: 40px;
        gap: 32px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        background-color: #1E2D69;
        border-radius: 10px 100px 10px 10px;
      }

      .logo-img {
        width: 135px;
        height: auto;
      }

      .left2 {
        display: flex;
        gap: 16px;
        align-items: center;
      }

      .left2 div {
        width: 48px;
        height: 48px;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #0c122c;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <!-- 
  You’ve used 815 GB of your storage

  185 GB Left
  
  0 GB
  1000 GB
   -->

    <main>

        <section class="left-container">
            <img class="logo-img" src="images/logo.svg" alt="logo">

          <div class="left2">
            <div><img src="images/icon-document.svg" alt="" width="19.18px" height="23.98px"></div>
            <div><img src="images/icon-folder.svg" alt="" width="24px" height="19.2px"></div>
            <div><img src="images/icon-upload.svg" alt="" width="24px" height="16px"></div>
          </div>

        </section>






      <section class="">

      </section>








    </main>
  </body>
</html>
